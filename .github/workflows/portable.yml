name: Portable build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to attach the zip to (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build portable package
        id: build
        shell: pwsh
        run: ./packaging/build-portable.ps1 -Python (Get-Command python).Source

      - name: Smoke test bundled backend
        id: smoke
        shell: pwsh
        run: ./packaging/smoke-test.ps1 -Root dist/AgentGroupRoom

      - uses: actions/upload-artifact@v4
        with:
          name: AgentGroupRoom-win64-portable
          path: dist/*.zip
          if-no-files-found: error

      - name: Unit tests on the bundled runtime
        id: tests
        timeout-minutes: 45
        shell: pwsh
        run: ./packaging/run-tests.ps1 -Root dist/AgentGroupRoom -ModuleTimeoutSeconds 180

      - name: Publish release
        if: always() && steps.build.outcome == 'success' && steps.smoke.outcome == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TEST_SUMMARY: ${{ steps.tests.outputs.summary }}
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          $tests = if ($env:TEST_SUMMARY) { $env:TEST_SUMMARY } else { 'Unit tests did not report a result; see the workflow run.' }
          $notes = "Windows portable build. Extract the folder and run AgentGroupRoom.exe; all data stays in its data folder. See README-PORTABLE.md inside the archive.`n`n$tests (CI runner, no signed-in CLIs)."
          gh release create $env:RELEASE_TAG $zip.FullName --title "Agent Group Room $env:RELEASE_TAG" --notes $notes
